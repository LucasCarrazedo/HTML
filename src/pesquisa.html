<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title> Exercício 16 - Pesquisa </title>
    </head>
    <body>
        <h1> Pesquisa de Opinião </h1>

        <form>

            <h3> Digite seu nome: </h3>
            <input type="text" id="name" required="name">

            <h3> Selecione seu gênero: </h3>
            <input type="radio" id="masc" name="genero" value="masculino"
            <label for="masc"> Masculino </label><br>

            <input type="radio" id="fem" name="genero" value="feminino">
            <label for="fem"> Feminino </label><br>
            
            <input type="radio" id="outro" name="genero" value="outro"
            <label for="outro"> Outro </label><br>

            <h3> Quais são seus hobbies? (Selecionar quantos quiser): </h3>
            <input type="checkbox" id="futebol" value="futebol">
            <label for="futebol"> Jogar Futebol </label><br>
            <input type="checkbox" id="videogames" value="videogames">
            <label for="videogames"> Jogar videogames </label><br>
            <input type="checkbox" id="musicas" value="musicas">
            <label for="musicas"> Escutar músicas </label><br>
            <input type="checkbox" id="futebolamericano" value="futebolamericano">
            <label for="futebolamericano"> Jogar Futebol Americano </label><br>

            <button type="submit"> Enviar </button>
        </form>
    </body>
</html>
